<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You 💌</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- First screen -->
    <main class="container" id="intro">

        <h1>Hey...</h1>

        <p>I made something for you.</p>

        <button id="openButton">Open 💌</button>

    </main>


    <!-- Letter screen -->
    <section class="letter hidden" id="letter">

        <!-- Message on the left -->
        <div class="message" id="sideMessage">

            <p>I've been wanting to tell you something...</p>

        </div>


        <!-- Envelope -->
        <div class="envelope" id="envelope">

            <!-- Paper inside envelope -->
            <div class="paper">

                <h2>For You 💗</h2>

                <p>
                    There's something I've been wanting to say...
                </p>

                <p>
                    I'll put the actual message here later.
                </p>

            </div>


            <!-- Envelope flap -->
            <div class="envelope-top"></div>


            <!-- Envelope body -->
            <div class="envelope-body">

                <span>💌</span>

                <p>Click me</p>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
