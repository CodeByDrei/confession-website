<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 💌</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- INTRO SCREEN -->

    <main class="container" id="intro">
        <h1>Hey...</h1>
        <p>I made something for you.</p>
        <button id="openButton">Open 💌</button>
    </main>


    <!-- LETTER SCREEN -->

    <section class="letter hidden" id="letter">

        <div class="message">
            <p>I've been wanting to tell you something...</p>
        </div>

        <div class="envelope" id="envelope">

            <div class="envelope-top"></div>

            <div class="envelope-body">
                <span>💌</span>
                <p>Click me</p>
            </div>

            <div class="paper">
                <h2>For You 💗</h2>

                <p>There's something I've been wanting to say...</p>

                <p>I'll put the actual message here later.</p>
            </div>

        </div>


        <!-- CONTINUE BUTTON -->

        <button class="continue-button" id="continueButton">
            Continue →
        </button>

    </section>


    <!-- QUESTION SCREEN -->

    <section class="question hidden" id="question">

        <div class="question-box">

            <h1>Do you like me back? 💗</h1>

            <div class="answer-buttons">
                <button id="yesButton">Yes 💕</button>
                <button id="noButton">No 🥲</button>
            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
