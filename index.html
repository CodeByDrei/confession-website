<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You 💌</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- First screen -->
    <main class="container" id="intro">
        <h1>Hey...</h1>

        <p>I made something for you.</p>

        <button id="openButton">Open 💌</button>
    </main>


    <!-- Letter screen -->
    <section class="letter hidden" id="letter">

        <div class="message">
            <p>I've been wanting to tell you something...</p>
        </div>

        <div class="envelope" id="envelope">
            <div class="envelope-top"></div>

            <div class="envelope-body">
                <span>💌</span>
                <p>Click me</p>
            </div>
        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
