<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For You 💌</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- INTRO -->

    <section
        class="intro"
        id="intro"
    >

        <div class="intro-content">

            <p class="intro-small">
                Hey...
            </p>

            <h1>
                I made something for you.
            </h1>

            <button id="openButton">
                Open 💌
            </button>

        </div>

    </section>


    <!-- LETTER -->

    <section
        class="letter hidden"
        id="letter"
    >

        <div
            class="envelope"
            id="envelope"
        >

            <div class="envelope-back"></div>

            <div class="paper">

                <div class="letter-content">

                    <p>
                        -- your confession/message here --
                    </p>

                </div>

            </div>

            <div class="envelope-front"></div>

        </div>


        <button
            id="continueButton"
            class="continue-button hidden"
        >
            Continue
        </button>

    </section>


    <!-- QUESTION -->

    <section
        class="question hidden"
        id="question"
    >

        <div class="question-box">

            <h1>
                Do you like me back? ❤️
            </h1>

            <div class="answer-buttons">

                <button id="yesButton">
                    Yes ❤️
                </button>

                <button id="noButton">
                    No 🥲
                </button>

            </div>

        </div>

    </section>


    <!-- YES RESPONSE -->

    <section
        class="response hidden"
        id="yesResponse"
    >

        <div class="response-box">

            <h1>
                You said yes ❤️
            </h1>

            <p>
                I’m really glad you answered.
            </p>


            <form
                action="https://formspree.io/f/mljepglw"
                method="POST"
                id="yesForm"
            >

                <input
                    type="hidden"
                    name="response"
                    value="YES 💕"
                >

                <textarea
                    id="yesReason"
                    name="reason"
                    placeholder="Why? (optional)"
                ></textarea>

                <button
                    type="submit"
                    id="yesSubmitButton"
                    disabled
                >
                    Send 💌
                </button>

                <button
                    type="button"
                    id="yesSkipButton"
                >
                    Skip
                </button>

            </form>

        </div>

    </section>


    <!-- NO RESPONSE -->

    <section
        class="response hidden"
        id="noResponse"
    >

        <div class="response-box">

            <h1>
                You said no 🥲
            </h1>

            <p>
                It’s okay. Thank you for being honest.
            </p>


            <form
                action="https://formspree.io/f/mljepglw"
                method="POST"
                id="noForm"
            >

                <input
                    type="hidden"
                    name="response"
                    value="NO 🥲"
                >

                <textarea
                    id="noReason"
                    name="reason"
                    placeholder="Anything you want to say? (optional)"
                ></textarea>

                <button
                    type="submit"
                    id="noSubmitButton"
                    disabled
                >
                    Send 💌
                </button>

                <button
                    type="button"
                    id="noSkipButton"
                >
                    Skip
                </button>

            </form>

        </div>

    </section>


    <!-- FINISH -->

    <section
        class="finish hidden"
        id="finish"
    >

        <div class="finish-box">

            <h1>
                Thank you 💌
            </h1>

            <p>
                That's all I wanted to ask.
            </p>

            <p>
                Take care ❤️
            </p>

        </div>

    </section>


    <!-- YOUTUBE MUSIC -->

    <iframe
        id="music"
        width="0"
        height="0"
        src="https://www.youtube-nocookie.com/embed/Q49pnA4jsp8?enablejsapi=1&playsinline=1&rel=0"
        frameborder="0"
        allow="autoplay"
    >
    </iframe>


    <script
        src="https://www.youtube.com/iframe_api"
    ></script>

    <script src="script.js"></script>

</body>

</html>
